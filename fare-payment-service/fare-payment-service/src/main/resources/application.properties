spring.application.name=fare-payment-service
server.port=8084

# Same signing secret as account-service: all 4 services validate tokens
# issued by Account Service, so this value must stay in sync with
# account-service's jwt.secret. This service never issues tokens itself.
# The default is a dev-only value - set JWT_SECRET outside local dev.
jwt.secret=${JWT_SECRET:r1d3l1nk-4cc0unt-s3rv1c3-jwt-s1gn1ng-k3y-ch4ng3-m3-1n-pr0duct10n-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_fare}
# Creates the unique indexes on fare_records.rideId and payments.paidRideId.
spring.data.mongodb.auto-index-creation=true
# Store BigDecimal money as Decimal128 (exact), not as strings or doubles.
spring.data.mongodb.representation.big-decimal=decimal128

# Fare rule (see util.FareCalculator), amounts in LKR:
#   fare = max(minimumFare, baseFare + perKm * distanceKm + perMin * durationMin) * multiplier[vehicleType]
# rounded to 2 decimal places (HALF_UP).
fare.currency=LKR
fare.base-fare=300
fare.per-km=120
fare.per-min=10
fare.minimum-fare=500
# Used to estimate duration when an estimate request has no durationMin.
fare.average-speed-kmh=25
fare.multipliers.SEDAN=1.0
fare.multipliers.HATCHBACK=0.9
fare.multipliers.VAN=1.5
fare.multipliers.TUK=0.8
# Kept for existing clients and stored rides that use these names.
fare.multipliers.CAR=1.0
fare.multipliers.BIKE=0.6
