spring.application.name=fare-payment-service
server.port=8084

# Set the same JWT_SECRET in every service.
jwt.secret=${JWT_SECRET:replace-with-a-random-secret-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Local default; use mongodb://mongo:27017/ridelink_fare_payment in Docker Compose.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_fare_payment}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.representation.big-decimal=decimal128

fare.currency=LKR
fare.base-fare=300
fare.per-km=120
fare.per-min=10
fare.minimum-fare=500
fare.average-speed-kmh=25
fare.multipliers.SEDAN=1.0
fare.multipliers.HATCHBACK=0.9
fare.multipliers.VAN=1.5
fare.multipliers.TUK=0.8
fare.multipliers.CAR=1.0
fare.multipliers.BIKE=0.6

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
