spring.application.name=driver-service
server.port=8082

# Set the same JWT_SECRET in every service.
jwt.secret=${JWT_SECRET:replace-with-a-random-secret-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Local default; use mongodb://mongo:27017/ridelink_driver in Docker Compose.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_driver}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
