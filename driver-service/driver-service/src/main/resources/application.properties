spring.application.name=driver-service
server.port=8082

# Same signing secret as account-service and fare-payment-service: all 4
# services validate tokens issued by Account Service. This service never
# issues tokens itself. The default is a dev-only value - set JWT_SECRET
# to the same value in all 4 services outside local dev.
jwt.secret=${JWT_SECRET:r1d3l1nk-4cc0unt-s3rv1c3-jwt-s1gn1ng-k3y-ch4ng3-m3-1n-pr0duct10n-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_driver}
# Creates the unique (sparse) indexes on drivers.email and drivers.vehicleNumber.
spring.data.mongodb.auto-index-creation=true

# Actuator: expose only the health endpoint (UP/DOWN, includes MongoDB);
# no details, no other endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
