spring.application.name=ride-service
server.port=8083
driver.service.base-url=${DRIVER_SERVICE_BASE_URL:${DRIVER_SERVICE_URL:http://localhost:8082}}
fare.service.base-url=${FARE_SERVICE_BASE_URL:${FARE_SERVICE_URL:http://localhost:8084}}

# Timeouts for every call to Driver and Fare & Payment Service.
ride.http.connect-timeout=2s
ride.http.read-timeout=3s

# On completion, also record the simulated, already-collected payment via
# fare-payment-service's legacy POST /api/payments/finalize, as before, so
# receipts keep appearing straight after completion. Set to false once
# passengers pay through POST /api/payments instead.
ride.payment.auto-charge-on-complete=true

# Same signing secret as the other 3 services: all validate tokens issued
# by Account Service. This service never issues tokens itself. The default
# is a dev-only value - set JWT_SECRET to the same value in all 4 services
# outside local dev.
jwt.secret=${JWT_SECRET:r1d3l1nk-4cc0unt-s3rv1c3-jwt-s1gn1ng-k3y-ch4ng3-m3-1n-pr0duct10n-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_ride}
# Store BigDecimal fares as Decimal128 (exact), not as strings.
spring.data.mongodb.representation.big-decimal=decimal128

# Actuator: expose only the health endpoint (UP/DOWN, includes MongoDB);
# no details, no other endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
