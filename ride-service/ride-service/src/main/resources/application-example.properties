spring.application.name=ride-service
server.port=8083
driver.service.base-url=${DRIVER_SERVICE_BASE_URL:${DRIVER_SERVICE_URL:http://localhost:8082}}
fare.service.base-url=${FARE_SERVICE_BASE_URL:${FARE_SERVICE_URL:http://localhost:8084}}

ride.http.connect-timeout=2s
ride.http.read-timeout=3s
ride.payment.auto-charge-on-complete=${RIDE_PAYMENT_AUTO_CHARGE_ON_COMPLETE:true}

# Set the same JWT_SECRET in every service.
jwt.secret=${JWT_SECRET:replace-with-a-random-secret-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Local default; use mongodb://mongo:27017/ridelink_ride in Docker Compose.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_ride}
spring.data.mongodb.representation.big-decimal=decimal128

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
