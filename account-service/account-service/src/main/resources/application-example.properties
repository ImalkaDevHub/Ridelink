spring.application.name=account-service
server.port=8081

# Set the same JWT_SECRET in every service.
jwt.secret=${JWT_SECRET:replace-with-a-random-secret-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Local default; use mongodb://mongo:27017/ridelink_account in Docker Compose.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_account}
spring.data.mongodb.auto-index-creation=true

app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@ridelink.local}
app.admin.password=${ADMIN_PASSWORD:change-me-before-use}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
