spring.application.name=account-service
server.port=8081

# Must match jwt.secret in the other three services, which validate the
# tokens issued here. The default is a dev-only value - set JWT_SECRET
# (at least 32 bytes, signed with HS256) everywhere else.
jwt.secret=${JWT_SECRET:r1d3l1nk-4cc0unt-s3rv1c3-jwt-s1gn1ng-k3y-ch4ng3-m3-1n-pr0duct10n-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_account}
# Creates the unique index on accounts.email declared with @Indexed.
spring.data.mongodb.auto-index-creation=true

# Admin account seeded at startup if absent (see config.AdminSeeder).
# Dev-only defaults - set ADMIN_EMAIL / ADMIN_PASSWORD outside local dev.
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@ridelink.local}
app.admin.password=${ADMIN_PASSWORD:DevAdmin123}

# Actuator: expose only the health endpoint (UP/DOWN, includes MongoDB);
# no details, no other endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
